</html><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakshi Khurana (@sakshi.khurana.inn) • Direct Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-100 via-sky-50/40 to-pink-50/40 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

    <!-- Main Mobile-First Card Container -->
    <main class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-slate-200/80 border border-slate-100 overflow-hidden flex flex-col">

        <!-- Top Instagram-Style Header -->
        <header class="bg-white border-b border-slate-100 p-4 sm:p-5">
            <div class="flex items-center justify-between gap-2.5">
                <!-- Avatar + Handle & Status -->
                <div class="flex items-center gap-3 min-w-0">
                    <!-- Instagram Gradient Story Ring -->
                    <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                       target="_blank" 
                       rel="noopener noreferrer"
                       aria-label="Visit Sakshi Khurana on Instagram"
                       class="relative shrink-0 p-[3px] rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 hover:scale-105 transition-transform duration-200">
                        <div class="bg-white p-[2px] rounded-full">
                            <img id="headerAvatar"
                                 src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=256&q=80" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/150x150/0ea5e9/ffffff?text=SK';"
                                 alt="Sakshi Khurana" 
                                 class="w-14 h-14 sm:w-16 sm:h-16 rounded-full object-cover">
                        </div>
                        <!-- Active Green Online Badge -->
                        <span class="absolute bottom-0.5 right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full" title="Online now"></span>
                    </a>

                    <!-- Name, Handle & Verified Badge -->
                    <div class="min-w-0">
                        <div class="flex items-center gap-1.5">
                            <h1 class="font-bold text-slate-900 text-base sm:text-lg truncate">Sakshi Khurana</h1>
                            <i class="fa-solid fa-circle-check text-sky-500 text-sm shrink-0" title="Verified"></i>
                        </div>
                        <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           class="text-xs sm:text-sm font-medium text-pink-600 hover:text-pink-700 truncate block">
                            @sakshi.khurana.inn
                        </a>
                        <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5">
                            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            <span class="truncate">Online • Digital Creator</span>
                        </p>
                    </div>
                </div>

                <!-- Top-Right Instagram Follow CTA Button -->
                <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-white bg-[#0095F6] hover:bg-[#1877F2] active:scale-95 transition-all shadow-sm shadow-sky-500/20">
                    <i class="fa-brands fa-instagram text-sm sm:text-base"></i>
                    <span>Follow</span>
                </a>
            </div>

            <!-- Short Bio & Direct Telegram Strip -->
            <div class="mt-3.5 pt-3 border-t border-slate-100 flex items-center justify-between gap-2 text-xs text-slate-600">
                <span class="truncate">✨ Helping you grow &amp; earn digitally</span>
                <a href="https://t.me/Sakshikhuranan"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="shrink-0 font-semibold text-[#229ED9] hover:underline inline-flex items-center gap-1">
                    <i class="fa-brands fa-telegram"></i>
                    <span>Message on Telegram</span>
                </a>
            </div>
        </header>

        <!-- Interactive Demo Chat Section -->
        <section class="bg-slate-50/80 flex-1 flex flex-col">
            <!-- Chat Window Sub-header -->
            <div class="px-4 py-2.5 bg-slate-100/80 border-b border-slate-200/60 flex items-center justify-between text-[11px] font-medium text-slate-500">
                <span class="flex items-center gap-1.5">
                    <i class="fa-regular fa-comment-dots text-[#229ED9]"></i>
                    Direct Message Preview
                </span>
                <button type="button" id="resetDemoBtn" class="text-slate-500 hover:text-slate-800 underline underline-offset-2 transition-colors">
                    Replay demo
                </button>
            </div>

            <!-- Messages Feed -->
            <div id="chatMessages" class="p-4 space-y-3.5 min-h-[290px] max-h-[380px] overflow-y-auto scroll-smooth">
                <!-- Timestamp -->
                <div class="text-center">
                    <span class="text-[11px] font-medium text-slate-400 bg-white px-2.5 py-0.5 rounded-full border border-slate-100">Today</span>
                </div>
                <!-- Messages dynamically injected here -->
            </div>

            <!-- Quick Reply Suggestion Pills -->
            <div class="px-4 pb-2 pt-1 flex flex-wrap gap-2">
                <button type="button" 
                        data-message="Hey I want to start with you"
                        class="quick-reply-btn text-xs font-medium bg-white hover:bg-sky-50 text-slate-700 hover:text-[#229ED9] border border-slate-200 hover:border-sky-200 px-3 py-1.5 rounded-full shadow-xs transition-all active:scale-95">
                    👋 Hey I want to start with you
                </button>
                <button type="button" 
                        data-message="Tell me more details please!"
                        class="quick-reply-btn text-xs font-medium bg-white hover:bg-sky-50 text-slate-700 hover:text-[#229ED9] border border-slate-200 hover:border-sky-200 px-3 py-1.5 rounded-full shadow-xs transition-all active:scale-95">
                    ✨ Tell me more details
                </button>
            </div>

            <!-- Interactive Message Input Bar -->
            <form id="chatForm" class="p-3 bg-white border-t border-slate-100 flex items-center gap-2">
                <input type="text" 
                       id="messageInput" 
                       placeholder="Type 'Hey' or ask for details..." 
                       autocomplete="off"
                       class="flex-1 bg-slate-100 text-slate-800 placeholder-slate-400 text-sm rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-sky-500/40 focus:bg-white border border-transparent focus:border-sky-300 transition-all">
                <button type="submit" 
                        aria-label="Send message"
                        class="w-10 h-10 rounded-full bg-gradient-to-r from-[#229ED9] to-sky-600 text-white flex items-center justify-center shrink-0 hover:opacity-95 active:scale-95 transition-all shadow-sm">
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </section>

        <!-- Primary Bottom Telegram Direct CTA Banner -->
        <footer class="p-4 bg-white border-t border-slate-100 space-y-2.5">
            <a href="https://t.me/Sakshikhuranan" 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full flex items-center justify-center gap-2.5 py-3.5 px-5 rounded-2xl bg-[#229ED9] hover:bg-[#1c8cc2] text-white font-semibold text-sm sm:text-base shadow-lg shadow-sky-500/25 active:scale-[0.99] transition-all">
                <i class="fa-brands fa-telegram text-xl"></i>
                <span>Chat on Telegram • @Sakshikhuranan</span>
            </a>

            <!-- Secondary Link Row -->
            <div class="flex items-center justify-center gap-4 text-xs text-slate-500 pt-0.5">
                <a href="https://www.instagram.com/sakshi.khurana.inn?lqvp=Zjg2bXo3NnRla25v" 
                   target="_blank" 
                   rel="noopener noreferrer"
                   class="hover:text-pink-600 font-medium inline-flex items-center gap-1 transition-colors">
                    <i class="fa-brands fa-instagram"></i>
                    <span>Instagram Profile</span>
                </a>
                <span>•</span>
                <button type="button" id="copyUsernameBtn" class="hover:text-slate-800 font-medium inline-flex items-center gap-1 transition-colors">
                    <i class="fa-regular fa-copy"></i>
                    <span id="copyBtnText">Copy @Sakshikhuranan</span>
                </button>
            </div>
        </footer>
    </main>

    <!-- Interactive Chat & Demo Sequence Script -->
    <script>
        (function () {
            // =================================================================
            // CUSTOMIZE PROFILE AVATAR HERE:
            // Replace the URL below with "avatar.jpg" once you upload your
            // photo to your GitHub repository folder.
            // =================================================================
            const PROFILE_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=256&q=80";
            const TELEGRAM_URL = "https://t.me/Sakshikhuranan";

            // Apply PROFILE_AVATAR to the header image automatically
            const headerAvatar = document.getElementById("headerAvatar");
            if (headerAvatar) {
                headerAvatar.src = PROFILE_AVATAR;
            }

            const chatMessages = document.getElementById("chatMessages");
            const chatForm = document.getElementById("chatForm");
            const messageInput = document.getElementById("messageInput");
            const quickReplyBtns = document.querySelectorAll(".quick-reply-btn");
            const resetDemoBtn = document.getElementById("resetDemoBtn");
            const copyUsernameBtn = document.getElementById("copyUsernameBtn");
            const copyBtnText = document.getElementById("copyBtnText");

            let typingTimeout = null;
            let demoTimeout = null;

            // Safely escape HTML to prevent XSS when visitors type custom text
            function escapeHTML(str) {
                const div = document.createElement("div");
                div.textContent = str;
                return div.innerHTML;
            }

            // Smooth scroll chat container to the latest message
            function scrollToBottom() {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // Append visitor message bubble (Right aligned)
            function appendVisitorMessage(text) {
                const wrapper = document.createElement("div");
                wrapper.className = "flex justify-end";
                wrapper.innerHTML = `
                    <div class="max-w-[82%] bg-gradient-to-r from-pink-500 to-purple-600 text-white text-sm px-4 py-2.5 rounded-2xl rounded-br-sm shadow-sm">
                        <p class="leading-relaxed">${escapeHTML(text)}</p>
                    </div>
                `;
                chatMessages.appendChild(wrapper);
                scrollToBottom();
            }

            // Show "Sakshi is typing..." animated indicator
            function showTypingIndicator() {
                removeTypingIndicator();
                const typingEl = document.createElement("div");
                typingEl.id = "typingIndicator";
                typingEl.className = "flex items-end gap-2";
                typingEl.innerHTML = `
                    <img src="${PROFILE_AVATAR}" 
                         onerror="this.onerror=null; this.src='https://placehold.co/80x80/0ea5e9/ffffff?text=SK';"
                         alt="Sakshi" 
                         class="w-7 h-7 rounded-full object-cover shrink-0 border border-slate-200">
                    <div class="bg-white border border-slate-200/80 text-slate-500 text-xs px-3.5 py-2.5 rounded-2xl rounded-bl-sm shadow-xs flex items-center gap-2">
                        <span class="font-medium text-slate-600">Sakshi is typing</span>
                        <span class="flex gap-1">
                            <span class="w-1.5 h-1.5 bg-[#229ED9] rounded-full animate-bounce"></span>
                            <span class="w-1.5 h-1.5 bg-[#229ED9] rounded-full animate-bounce [animation-delay:150ms]"></span>
                            <span class="w-1.5 h-1.5 bg-[#229ED9] rounded-full animate-bounce [animation-delay:300ms]"></span>
                        </span>
                    </div>
                `;
                chatMessages.appendChild(typingEl);
                scrollToBottom();
            }

            function removeTypingIndicator() {
                const existing = document.getElementById("typingIndicator");
                if (existing) existing.remove();
            }

            // Append Sakshi's reply bubble with embedded Telegram direct CTA button
            function appendSakshiReply(buttonLabel = "Open Telegram Chat") {
                removeTypingIndicator();
                const wrapper = document.createElement("div");
                wrapper.className = "flex items-end gap-2";
                wrapper.innerHTML = `
                    <img src="${PROFILE_AVATAR}" 
                         onerror="this.onerror=null; this.src='https://placehold.co/80x80/0ea5e9/ffffff?text=SK';"
                         alt="Sakshi" 
                         class="w-7 h-7 rounded-full object-cover shrink-0 border border-slate-200">
                    <div class="max-w-[85%] bg-white border border-slate-200/80 text-slate-800 text-sm p-3.5 rounded-2xl rounded-bl-sm shadow-sm space-y-3">
                        <p class="leading-relaxed">
                            Hey! Thank you for messaging us. Please come to our Telegram for more details 👇
                        </p>
                        <a href="${TELEGRAM_URL}" 
                           target="_blank" 
                           rel="noopener noreferrer"
                           class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-3.5 rounded-xl bg-[#229ED9] hover:bg-[#1c8cc2] text-white font-semibold text-xs sm:text-sm shadow-sm transition-all active:scale-95">
                            <i class="fa-brands fa-telegram text-base"></i>
                            <span>${escapeHTML(buttonLabel)}</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[11px] opacity-90"></i>
                        </a>
                    </div>
                `;
                chatMessages.appendChild(wrapper);
                scrollToBottom();
            }

            // Handle any interactive message sent by visitor
            function handleUserMessage(text) {
                const cleanText = text.trim();
                if (!cleanText) return;

                clearTimeout(typingTimeout);
                clearTimeout(demoTimeout);

                appendVisitorMessage(cleanText);
                showTypingIndicator();

                typingTimeout = setTimeout(() => {
                    appendSakshiReply("Open Telegram Chat");
                }, 1050);
            }

            // Run automated welcome sequence on initial page load / replay
            function startDemoSequence() {
                clearTimeout(typingTimeout);
                clearTimeout(demoTimeout);

                chatMessages.innerHTML = `
                    <div class="text-center">
                        <span class="text-[11px] font-medium text-slate-400 bg-white px-2.5 py-0.5 rounded-full border border-slate-100">Today</span>
                    </div>
                `;

                // Step 1: Initial visitor prompt
                appendVisitorMessage("Hey I want to start with you");

                // Step 2: Typing indicator
                demoTimeout = setTimeout(() => {
                    showTypingIndicator();

                    // Step 3: Sakshi's reply with Telegram link
                    typingTimeout = setTimeout(() => {
                        appendSakshiReply("Chat on Telegram");
                    }, 1150);
                }, 450);
            }

            // Form submit handler
            chatForm.addEventListener("submit", function (e) {
                e.preventDefault();
                const val = messageInput.value;
                if (!val.trim()) return;
                messageInput.value = "";
                handleUserMessage(val);
            });

            // Quick reply pills handler
            quickReplyBtns.forEach((btn) => {
                btn.addEventListener("click", function () {
                    const msg = this.getAttribute("data-message");
                    handleUserMessage(msg);
                });
            });

            // Replay demo button
            resetDemoBtn.addEventListener("click", startDemoSequence);

            // Copy Telegram username helper
            copyUsernameBtn.addEventListener("click", function () {
                const tempInput = document.createElement("input");
                tempInput.value = "@Sakshikhuranan";
                document.body.appendChild(tempInput);
                tempInput.select();
                try {
                    document.execCommand("copy");
                    copyBtnText.textContent = "Copied @Sakshikhuranan!";
                    setTimeout(() => {
                        copyBtnText.textContent = "Copy @Sakshikhuranan";
                    }, 2000);
                } catch (err) {
                    copyBtnText.textContent = "@Sakshikhuranan";
                }
                document.body.removeChild(tempInput);
            });

            // Launch welcome demo sequence when page loads
            window.addEventListener("load", startDemoSequence);
        })();
    </script>
</body>
